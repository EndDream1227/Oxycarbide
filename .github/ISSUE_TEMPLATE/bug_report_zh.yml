name: Bug 报告
description: 反馈 Oxycarbide 的崩溃、报错或异常行为。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您反馈问题。请尽量把信息填写完整，这样更容易定位原因。
        如果是使用上的疑问或需要帮助，请到 Discussions 提问，不要使用这个表单。

  - type: input
    id: mod-version
    attributes:
      label: 模组版本
      description: 模组列表里显示的版本，或者 jar 文件名中的版本号。
      placeholder: "例如 0.1.0-26.3-fabric"
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft 版本
      placeholder: "例如 26.3"
    validations:
      required: true

  - type: input
    id: loader-version
    attributes:
      label: Fabric Loader 版本
      placeholder: "例如 0.19.5"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 问题发生在哪里？
      options:
        - 单人游戏
        - 多人游戏（客户端）
        - 专用服务器
        - 客户端和服务端都有
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 请说明实际发生了什么，以及你原本期望的结果。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 安装模组
        2. 进入世界
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或崩溃报告
      description: 请粘贴完整的日志或崩溃报告，会自动格式化为代码块。如果没有日志，请填写“无”。
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复问题。
          required: true
        - label: 我使用的是最新版本的模组和 Fabric Loader。
          required: true
        - label: 我已移除日志中的个人或敏感信息。
          required: true
